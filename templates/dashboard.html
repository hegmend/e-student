<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Кабінет студента</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

<div class="top">
    <h1>Привіт, {{ user[1] }}!</h1>
    <a class="logout" href="/logout">Вийти</a>
</div>

<div class="card">
    <h2>Студентський квиток</h2>
    <p><b>Ім'я:</b> {{ user[1] }}</p>
    <p><b>Email:</b> {{ user[2] }}</p>
    <p><b>Група:</b> {{ user[4] }}</p>
</div>

<div class="card">
    <h2>Пропуск у гуртожиток</h2>
    <p>Статус: <b class="allowed">Дозволено</b></p>
</div>

<div class="card">
    <h2>Новини</h2>
    <ul>
        <li>📌 Завтра пари за розкладом</li>
        <li>📌 До 10 числа треба здати лабораторні</li>
        <li>📌 Студентська рада проводить опитування</li>
    </ul>
</div>

</body>
</html>
