<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Кабінет студента</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fafafa;
            padding: 20px;
        }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout {
            padding: 8px 14px;
            background: #e0e0e0;
            border-radius: 6px;
            text-decoration: none;
        }
        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        h1, h2 { font-weight: normal; }
    </style>
</head>
<body>

<div class="top">
    <h1>Привіт, {{ user[1] }}!</h1>
    <a class="logout" href="/logout">Вийти</a>
</div>

<div class="card">
    <h2>Студентський квиток</h2>
    <p><b>Ім'я:</b> {{ user[1] }}</p>
    <p><b>Email:</b> {{ user[2] }}</p>
    <p><b>Група:</b> {{ user[4] }}</p>
</div>

<div class="card">
    <h2>Пропуск у гуртожиток</h2>
    <p>Статус: <b>Дозволено</b></p>
</div>

<div class="card">
    <h2>Новини</h2>
    <ul>
        <li>📌 Завтра пари за розкладом</li>
        <li>📌 До 10 числа треба здати лабораторні</li>
        <li>📌 Студентська рада проводить опитування</li>
    </ul>
</div>

</body>
</html>
