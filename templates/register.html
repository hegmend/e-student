<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація | e-Student</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="centered">

<div class="box">
    <h1>Create Account</h1>

    <div class="tabs">
        <div class="tab" onclick="location.href='/login'">Sign In</div>
        <div class="tab active">Sign Up</div>
    </div>

    <form method="POST">
        <input type="text" name="name" placeholder="First & Last name" required>
        <input type="email" name="email" placeholder="Email address" required>
        <input type="text" name="group" placeholder="Group (e.g. ІП-12)" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit" class="submit">Create Account</button>
    </form>
</div>

</body>
</html>
