<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація | e-Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 30px;
            width: 340px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { margin-bottom: 20px; font-weight: normal; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            background: #e0e0e0;
        }
        a {
            display: inline-block;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Реєстрація</h2>

    <form method="POST">
        <input type="text" name="name" placeholder="Ім'я та Прізвище" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="group" placeholder="Група (наприклад ІП-12)" required>
        <input type="password" name="password" placeholder="Пароль" required>

        <button type="submit">Створити акаунт</button>
    </form>

    <a href="/login">Вже є акаунт? Увійти</a>
</div>

</body>
</html>
