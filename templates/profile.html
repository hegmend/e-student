<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Профіль | e-Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <nav class="sidebar">
        <a href="/dashboard" class="menu-item" title="Головна"> 
            <img class="icon" src="{{ url_for('static', filename='home.jpg') }}">
            <span class="menu-text">Головна</span>
        </a>

        <a href="/profile" class="menu-item active" title="Профіль"> 
            <img class="icon" src="{{ url_for('static', filename='avatar.jpg') }}">
            <span class="menu-text">Профіль</span>
        </a>

        <a href="/news" class="menu-item" title="Новини">
            <img class="icon" src="{{ url_for('static', filename='news.jpg') }}">
            <span class="menu-text">Новини</span>
        </a>

        <a href="/settings" class="menu-item" title="Налаштування">
            <img class="icon" src="{{ url_for('static', filename='settings.jpg') }}">
            <span class="menu-text">Налаштування</span>
        </a>

        <a href="/chats" class="menu-item" title="Чати">
            <img class="icon" src="{{ url_for('static', filename='chat.jpg') }}">
            <span class="menu-text">Чати</span>
        </a>

        <a href="{{ url_for('logout') }}" class="menu-item logout" title="Вийти">
            <img class="icon" src="{{ url_for('static', filename='logout.jpg') }}">
            <span class="menu-text">Вийти</span>
        </a>
    </nav>

    <main class="main-content">
        <h1>Мій Профіль</h1>
        
        <div class="card profile-details">
            <div class="profile-card">
                <img class="large-avatar" src="{{ url_for('static', filename='avatar.jpg') }}">
                <div class="info">
                    <h2>{{ user[1] }}</h2> <p><b>№ Пропуску:</b> {{ user[0] }}</p> 
                    <p><b>Група:</b> {{ user[4] }}</p>
                    <p><b>Email:</b> {{ user[2] }}</p>
                    <p><b>Статус:</b> Активний студент</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Студентський квиток (Електронний)</h2>
            <p><b>Ім'я:</b> {{ user[1] }}</p>
            <p><b>Група:</b> {{ user[4] }}</p>
            <p><b>Дійсний до:</b> 01.07.2028</p>
        </div>
        
    </main>

</div>

</body>
</html>
